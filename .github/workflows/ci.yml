name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "temporary-github-actions-secret-key-for-testing"
      DATABASE_URL: "sqlite:///./nexa_ai.db"
      ALGORITHM: "HS256"

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python info
        run: |
          python -V
          python -m pip --version
          python -m pip list


      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; 
          fi
          
          pip install pytest

      - name: Run tests (verbose + junit)
        working-directory: backend
        run: |
          python -m pytest -q -vv --junitxml=backend/test-results.xml 2>&1 | tee backend/pytest.log

      - name: Upload test results 
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            backend/.pytest_cache
            backend/tests
            backend/test-results.xml
            backend/pytest.log
