version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    restart: unless-stopped

  ollama:
    image: ghcr.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Note: Ollama may require special setup; replace this service with your local Ollama deployment if needed.
